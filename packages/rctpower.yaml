## This package requires rctclient
## You can install RCT Power Integration https://github.com/weltenwort/home-assistant-rct-power-integration

input_text:
  rct_ip_address:
    name: "RCT IP Address"
    initial: "192.168.1.193"

input_number:
  rct_soc_max:
    name: Max SOC target
    # ToDo: Read inital value when HA starts
    # initial: 97
    # ToDo: Find a good min-value (gt rct_soc_min)
    min: 30
    max: 97
    step: 1
    unit_of_measurement: "%"
    icon: "mdi:battery-high"

  rct_soc_min:
    name: Min SOC target
    # ToDo: Read inital value when HA starts
    # initial: 7
    min: 7
    # ToDo: Find a good max-value (lt rct_soc_max)
    max: 50
    step: 1
    unit_of_measurement: "%"
    icon: "mdi:battery-low"

  rct_quickcharge_power:
    name: QuickCharge Power
    min: 0
    max: 6000
    step: 100
    mode: slider
    unit_of_measurement: W
    icon: mdi:run-fast

input_select:
  rct_soc_strategy_selector:
    name: "RCT SOC strategy"
    options:
      - "4: Internal"
      - "0: SOC target"
      - "1: Constant"
      - "2: External"
      - "3: Average Battery Voltage"
      - "5: Schedule"
    icon: "mdi:strategy"

command_line:
  - sensor:
      name: "Actual RCT SOC Strategy"
      unique_id: actual_rct_soc_strategy
      command: 'python /config/rct.py get_short power_mng.soc_strategy --host={{ states("input_text.rct_ip_address") }}'
      scan_interval: 30
  - sensor:
      name: "Write RCT SOC Strategy"
      unique_id: actual_rct_soc_strategy
      command: 'python /config/rct.py set power_mng.soc_strategy 2 --host={{ states("input_text.rct_ip_address") }}'
      scan_interval: 30


template:
  - switch: # On = Lock battery, Off = Unlock battery 
      - name: "Lock battery"
        unique_id: lock_battery
        turn_on:
          - action: switch.turn_off
            target:
              entity_id: switch.rct_max_charge 
          - action: shell_command.writerctpower
            data:
              object_name: "power_mng.soc_strategy"
              object_value: "2"
          - action: shell_command.writerctpower
            data:
              object_name: "power_mng.battery_power_extern"
              object_value: "0"
        turn_off:
          - action: shell_command.writerctpower
            data:
              object_name: "power_mng.soc_strategy"
              object_value: >
                {{ states('input_select.rct_soc_strategy_selector').split(':')[0] }}

      - name: "QuickCharge battery"
        unique_id: rct_quickcharge_battery
        turn_on:
          - action: switch.turn_off
            target:
              entity_id: switch.lock_battery 
          - action: shell_command.writerctpower
            data:
              object_name: "power_mng.soc_strategy"
              object_value: "2"
          - action: shell_command.writerctpower
            data:
              object_name: "power_mng.battery_power_extern"
              object_value: "{{states('input_number.rct_quickcharge_power') | int * -1}}"
        turn_off:
          - action: shell_command.writerctpower
            data:
              object_name: "power_mng.soc_strategy"
              object_value: >
                {{ states('input_select.rct_soc_strategy_selector').split(':')[0] }}
    
      - name: "Use Grid Power"
        unique_id: rct_use_grid_power
        # icon: battery-charging
        turn_on:
          - action: shell_command.writerctpower
            data:
              object_name: "power_mng.use_grid_power_enable"
              object_value: "True"
        turn_off:
          - action: shell_command.writerctpower
            data:
              object_name: "power_mng.use_grid_power_enable"
              object_value: "False"

automation:
  - alias: "set_rct_soc_max"
    trigger:
      platform: state
      entity_id: input_number.rct_soc_max
    action:
      - action: shell_command.writerctpower
        data:
          object_name: "power_mng.soc_max"
          object_value: "{{states('input_number.rct_soc_max')|multiply(0.01)|round(2)}}"
    mode: queued
  - alias: "set_rct_soc_min"
    trigger:
      platform: state
      entity_id: input_number.rct_soc_min
    action:
      - action: shell_command.writerctpower
        data:
          object_name: "power_mng.soc_min"
          object_value: "{{states('input_number.rct_soc_min')|multiply(0.01)|round(2)}}"
      # - action: shell_command.writerctpower
      #   data:
      #     object_name: "power_mng.soc_charge"
      #     object_value: "{{states('input_number.rct_soc_min')|multiply(0.01)-0.02|round(2)}}"
    mode: queued
  - alias: "RCT Strategy Changer"
    triggers:
      - trigger: state
        entity_id: input_select.rct_soc_strategy_selector
    actions:
      - action: shell_command.writerctpower
        data:
          object_name: "power_mng.soc_strategy"
          object_value: >
            {{ states('input_select.rct_soc_strategy_selector').split(':')[0] }}

shell_command:
  writerctpower: 'python /config/rct.py set {{ object_name }} {{ object_value }} --host={{ states("input_text.rct_ip_address") }}'
  readrctpower: 'python /config/rct.py get {{ object_name }} --host={{ states("input_text.rct_ip_address") }}'
  dummy: "echo 'dummy command'"
